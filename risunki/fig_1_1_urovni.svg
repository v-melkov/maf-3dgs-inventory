<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="390" fill="#ffffff"/>

  <!-- header -->
  <rect x="10" y="10" width="680" height="34" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="180" y1="10" x2="180" y2="44" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="420" y1="10" x2="420" y2="44" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="10" x2="600" y2="44" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="95" y="32" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Уровень данных</text>
  <text x="300" y="32" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Состав сведений</text>
  <text x="510" y="32" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Средства получения</text>
  <text x="645" y="32" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Состояние</text>

  <!-- row 1 -->
  <rect x="10" y="44" width="680" height="82" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="10" y="44" width="170" height="82" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="420" y1="44" x2="420" y2="126" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="44" x2="600" y2="126" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="95" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Позиционный</text>
  <text x="300" y="80" font-size="11.5" text-anchor="middle" fill="#1a1a1a">Координаты X, Y, Z</text>
  <text x="300" y="98" font-size="11.5" text-anchor="middle" fill="#1a1a1a">в принятой системе</text>
  <text x="510" y="80" font-size="11" text-anchor="middle" fill="#1a1a1a">ГНСС-приёмник,</text>
  <text x="510" y="98" font-size="11" text-anchor="middle" fill="#1a1a1a">геодезическая съёмка</text>
  <path d="M 634 86 l 7 8 l 14 -17" fill="none" stroke="#2b7a3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- row 2 -->
  <rect x="10" y="126" width="680" height="82" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="10" y="126" width="170" height="82" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="420" y1="126" x2="420" y2="208" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="126" x2="600" y2="208" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="95" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Атрибутивный</text>
  <text x="300" y="162" font-size="11.5" text-anchor="middle" fill="#1a1a1a">Тип, материал, год</text>
  <text x="300" y="180" font-size="11.5" text-anchor="middle" fill="#1a1a1a">установки, владелец</text>
  <text x="510" y="162" font-size="11" text-anchor="middle" fill="#1a1a1a">Паспорт</text>
  <text x="510" y="180" font-size="11" text-anchor="middle" fill="#1a1a1a">благоустройства, ГИС</text>
  <path d="M 634 168 l 7 8 l 14 -17" fill="none" stroke="#2b7a3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- row 3 highlighted -->
  <rect x="10" y="208" width="680" height="82" fill="#fbeeee" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="10" y="208" width="170" height="82" fill="#f3dede" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="208" x2="420" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="208" x2="600" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="95" y="244" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Визуально-</text>
  <text x="95" y="261" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">геометрический</text>
  <text x="300" y="244" font-size="11.5" text-anchor="middle" fill="#1a1a1a">Габариты L × W × H,</text>
  <text x="300" y="262" font-size="11.5" text-anchor="middle" fill="#1a1a1a">форма, состояние</text>
  <text x="510" y="244" font-size="11" text-anchor="middle" fill="#1a1a1a">Массовые средства</text>
  <text x="510" y="262" font-size="11" text-anchor="middle" fill="#1a1a1a">отсутствуют</text>
  <path d="M 636 242 l 18 18 M 654 242 l -18 18" fill="none" stroke="#a52a2a" stroke-width="3" stroke-linecap="round"/>

  <!-- pointer -->
  <path d="M 350 290 L 350 316" fill="none" stroke="#a52a2a" stroke-width="2"/>
  <path d="M 350 324 l -6 -10 l 12 0 z" fill="#a52a2a"/>
  <rect x="170" y="326" width="360" height="48" rx="4" fill="#ffffff" stroke="#a52a2a" stroke-width="1.6"/>
  <text x="350" y="346" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Предмет настоящего исследования:</text>
  <text x="350" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">автоматизированное заполнение данного уровня</text>
</svg>
