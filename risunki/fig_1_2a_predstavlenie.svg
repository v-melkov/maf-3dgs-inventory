<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 476" width="700" height="476" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="gaussFall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a7fb0" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#4a7fb0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4a7fb0" stop-opacity="0.02"/>
    </radialGradient>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="700" height="476" fill="#ffffff"/>

  <!-- panel titles -->
  <text x="175" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">а) полигональная сетка</text>
  <text x="525" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">б) набор анизотропных гауссианов</text>

  <rect x="20" y="42" width="310" height="250" fill="#fcfcfc" stroke="#9a9a9a" stroke-width="1"/>
  <rect x="370" y="42" width="310" height="250" fill="#fcfcfc" stroke="#9a9a9a" stroke-width="1"/>

  <!-- ===== panel a ===== -->
  <path d="M 50 250 C 90 110, 200 260, 290 110" fill="none" stroke="#b9b9b9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="50,250 81.7,196 125.8,183.4 178.2,183.8 234.3,168.7 290,110"
            fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#1a1a1a">
    <circle cx="50" cy="250" r="4"/>
    <circle cx="81.7" cy="196" r="4"/>
    <circle cx="125.8" cy="183.4" r="4"/>
    <circle cx="178.2" cy="183.8" r="4"/>
    <circle cx="234.3" cy="168.7" r="4"/>
    <circle cx="290" cy="110" r="4"/>
  </g>
  <text x="175" y="274" font-size="11" text-anchor="middle" fill="#1a1a1a">вершины и рёбра образуют связную</text>
  <text x="175" y="288" font-size="11" text-anchor="middle" fill="#1a1a1a">аппроксимацию поверхности</text>

  <!-- ===== panel b ===== -->
  <path d="M 400 250 C 440 110, 550 260, 640 110" fill="none" stroke="#b9b9b9" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#2d5f8a" stroke-width="1.1">
    <ellipse cx="415.9" cy="223"   rx="27" ry="9"  fill="url(#gaussFall)" transform="rotate(-59.6 415.9 223)"/>
    <ellipse cx="453.8" cy="189.7" rx="30" ry="10" fill="url(#gaussFall)" transform="rotate(-16 453.8 189.7)"/>
    <ellipse cx="502"   cy="183.6" rx="28" ry="8"  fill="url(#gaussFall)" transform="rotate(0.4 502 183.6)"/>
    <ellipse cx="556.3" cy="176.3" rx="30" ry="9"  fill="url(#gaussFall)" transform="rotate(-15.1 556.3 176.3)"/>
    <ellipse cx="612.2" cy="139.4" rx="29" ry="10" fill="url(#gaussFall)" transform="rotate(-46.5 612.2 139.4)"/>
    <ellipse cx="431"   cy="205"   rx="17" ry="7"  fill="url(#gaussFall)" transform="rotate(-40 431 205)"/>
    <ellipse cx="478"   cy="185"   rx="18" ry="6"  fill="url(#gaussFall)" transform="rotate(-8 478 185)"/>
    <ellipse cx="529"   cy="180"   rx="19" ry="7"  fill="url(#gaussFall)" transform="rotate(-7 529 180)"/>
    <ellipse cx="585"   cy="158"   rx="18" ry="7"  fill="url(#gaussFall)" transform="rotate(-32 585 158)"/>
  </g>
  <text x="525" y="274" font-size="11" text-anchor="middle" fill="#1a1a1a">примитивы ориентированы по поверхности,</text>
  <text x="525" y="288" font-size="11" text-anchor="middle" fill="#1a1a1a">связность между ними отсутствует</text>

  <text x="350" y="308" font-size="10.5" text-anchor="middle" fill="#6a6a6a">серым показана фактическая поверхность объекта</text>

  <!-- ===== inset: single gaussian ===== -->
  <line x1="20" y1="320" x2="680" y2="320" stroke="#d0d0d0" stroke-width="1"/>

  <ellipse cx="150" cy="396" rx="78" ry="34" fill="url(#gaussFall)" stroke="#2d5f8a" stroke-width="1.4" transform="rotate(-25 150 396)"/>
  <ellipse cx="150" cy="396" rx="39" ry="17" fill="none" stroke="#2d5f8a" stroke-width="0.9" stroke-dasharray="4 3" transform="rotate(-25 150 396)"/>
  <line x1="150" y1="396" x2="244" y2="396" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="150" y1="396" x2="218.5" y2="364" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrA)"/>
  <line x1="150" y1="396" x2="136.6" y2="367" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrA)"/>
  <path d="M 190 396 A 40 40 0 0 0 186.3 379.1" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <circle cx="150" cy="396" r="3.5" fill="#1a1a1a"/>
  <text x="228" y="358" font-size="12" font-style="italic" fill="#1a1a1a">s₁</text>
  <text x="126" y="358" font-size="12" font-style="italic" fill="#1a1a1a">s₂</text>
  <text x="196" y="392" font-size="11" font-style="italic" fill="#1a1a1a">R</text>
  <text x="140" y="414" font-size="12" font-style="italic" fill="#1a1a1a">μ</text>
  <text x="150" y="458" font-size="11" text-anchor="middle" fill="#6a6a6a">один гауссиан (увеличено)</text>

  <text x="300" y="344" font-size="12" font-weight="bold" fill="#1a1a1a">Параметры одного гауссиана:</text>
  <text x="300" y="368" font-size="11.5" fill="#1a1a1a">μ — положение центра в пространстве</text>
  <text x="300" y="388" font-size="11.5" fill="#1a1a1a">s₁, s₂, s₃ — масштаб вдоль главных осей</text>
  <text x="300" y="408" font-size="11.5" fill="#1a1a1a">R — поворот примитива</text>
  <text x="300" y="428" font-size="11.5" fill="#1a1a1a">α — непрозрачность</text>
  <text x="300" y="448" font-size="11.5" fill="#1a1a1a">SH — сферические гармоники (цвет)</text>
</svg>
