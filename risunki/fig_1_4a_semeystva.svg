<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#ffffff"/>

  <!-- root -->
  <rect x="150" y="10" width="400" height="38" rx="4" fill="#dce6ef" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="350" y="34" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Методы выделения объекта из 3DGS-сцены</text>

  <!-- connector spine -->
  <path d="M 350 48 L 350 58 L 60 58 L 60 296" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <path d="M 60 88 L 86 88 M 60 140 L 86 140 M 60 192 L 86 192 M 60 244 L 86 244 M 60 296 L 86 296"
        fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrB)"/>

  <!-- row 1 -->
  <rect x="90" y="66" width="600" height="44" fill="#fcfcfc" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="330" y1="66" x2="330" y2="110" stroke="#c8c8c8" stroke-width="1"/>
  <text x="102" y="86" font-size="12" font-weight="bold" fill="#1a1a1a">Обучение признака</text>
  <text x="102" y="102" font-size="12" font-weight="bold" fill="#1a1a1a">гауссиана</text>
  <text x="342" y="85" font-size="11.5" fill="#1a1a1a">Gaussian Grouping [53], SAGA [18]</text>
  <text x="342" y="101" font-size="10.5" fill="#5a5a5a">признак оптимизируется вместе с геометрией и цветом</text>

  <!-- row 2 -->
  <rect x="90" y="118" width="600" height="44" fill="#fcfcfc" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="330" y1="118" x2="330" y2="162" stroke="#c8c8c8" stroke-width="1"/>
  <text x="102" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">Языковые</text>
  <text x="102" y="154" font-size="12" font-weight="bold" fill="#1a1a1a">признаковые поля</text>
  <text x="342" y="137" font-size="11.5" fill="#1a1a1a">LangSplat [39]</text>
  <text x="342" y="153" font-size="10.5" fill="#5a5a5a">выбор объекта по текстовому запросу в открытом словаре</text>

  <!-- row 3 -->
  <rect x="90" y="170" width="600" height="44" fill="#eaf1f7" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="330" y1="170" x2="330" y2="214" stroke="#c8c8c8" stroke-width="1"/>
  <text x="102" y="190" font-size="12" font-weight="bold" fill="#1a1a1a">Аналитическое</text>
  <text x="102" y="206" font-size="12" font-weight="bold" fill="#1a1a1a">решение разметки</text>
  <text x="342" y="189" font-size="11.5" fill="#1a1a1a">FlashSplat [54]</text>
  <text x="342" y="205" font-size="10.5" fill="#5a5a5a">метки находятся в замкнутой форме, обучение не требуется</text>

  <!-- row 4 -->
  <rect x="90" y="222" width="600" height="44" fill="#fcfcfc" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="330" y1="222" x2="330" y2="266" stroke="#c8c8c8" stroke-width="1"/>
  <text x="102" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">Уточнение границ</text>
  <text x="102" y="258" font-size="12" font-weight="bold" fill="#1a1a1a">объекта</text>
  <text x="342" y="241" font-size="11.5" fill="#1a1a1a">GradiSeg [26], Trace3D [47]</text>
  <text x="342" y="257" font-size="10.5" fill="#5a5a5a">согласованность разметки между ракурсами</text>

  <!-- row 5 -->
  <rect x="90" y="274" width="600" height="44" fill="#fcfcfc" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="330" y1="274" x2="330" y2="318" stroke="#c8c8c8" stroke-width="1"/>
  <text x="102" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">Геометрическая</text>
  <text x="102" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">регуляризация</text>
  <text x="342" y="293" font-size="11.5" fill="#1a1a1a">FeatureGS [20]</text>
  <text x="342" y="309" font-size="10.5" fill="#5a5a5a">оптимизация по собственным значениям ковариации</text>

  <!-- arrow to summary -->
  <path d="M 390 318 L 390 340" fill="none" stroke="#a52a2a" stroke-width="1.8"/>
  <path d="M 390 348 l -6 -10 l 12 0 z" fill="#a52a2a"/>

  <!-- summary -->
  <rect x="90" y="350" width="600" height="62" rx="4" fill="#fbeeee" stroke="#a52a2a" stroke-width="1.8"/>
  <text x="390" y="372" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Общая особенность всех семейств</text>
  <text x="390" y="390" font-size="11.5" text-anchor="middle" fill="#1a1a1a">результат оценивается двумерными метриками (mIoU, PSNR, SSIM, LPIPS);</text>
  <text x="390" y="406" font-size="11.5" text-anchor="middle" fill="#1a1a1a">метрическая достоверность геометрии не оценивается</text>
  <text x="390" y="430" font-size="10" text-anchor="middle" fill="#8a8a8a">Выделением показано семейство, положенное в основу разрабатываемой методики</text>
</svg>
